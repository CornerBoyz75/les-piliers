<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8315b"><title>Les piliers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f3ee;--fg:#1d1a2b;--mut:#6f6a80;--card:rgba(255,255,255,.88);--ln:#e8e2d8;--a:#ff8a3d;--b:#e8315b;--g:linear-gradient(135deg,var(--a),var(--b));--ok:#22a55b;--mb:#e0a21b;--no:#d6414f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12111c;--fg:#f4f1ff;--mut:#9a95b2;--card:rgba(36,34,56,.9);--ln:#34304a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
button{font:inherit;cursor:pointer;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:10px 16px}
h1{margin:0;font-size:22px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
header small{display:block;color:var(--mut);font-size:12px;margin-top:-2px}.sp{flex:1}
main{flex:1;min-height:0;position:relative}.v{position:absolute;inset:0}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);box-shadow:0 6px 20px #0002}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;border:2px solid #fff8}
.av.s{width:24px;height:24px;font-size:12px;border-width:1px}.av.xl{width:84px;height:84px;font-size:40px}
#map{width:100%;height:100%;z-index:0}
#sr{position:absolute;left:12px;right:64px;top:12px;z-index:500}
#sr input{border-radius:16px}#res{margin-top:6px;border-radius:16px;overflow:hidden}#res div{padding:10px 14px;border-top:1px solid var(--ln);cursor:pointer;font-size:14px}
.fabs{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.fab{width:42px;height:42px;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0}
#zh{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:500;padding:6px 14px;border-radius:20px;font-size:13px;color:var(--mut);white-space:nowrap}
#list{position:absolute;left:0;right:0;bottom:10px;z-index:500;display:flex;gap:10px;overflow-x:auto;padding:4px 14px}
.chip{flex:none;border-radius:18px;padding:10px 14px;text-align:left}.chip b{display:block}.chip small{color:var(--mut)}
.pinx{width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--g);border:3px solid #fff;box-shadow:0 4px 12px #0006;display:flex;align-items:center;justify-content:center}
.pinx span{transform:rotate(45deg);color:#fff;font-weight:800}
.lbl{background:var(--card);color:var(--fg);border:1px solid var(--ln);border-radius:10px;font-weight:700}
nav{display:flex;gap:6px;margin:6px 14px calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:26px}
nav button{flex:1;border:0;background:none;border-radius:20px;padding:8px 0;font-size:20px;color:var(--mut)}nav small{display:block;font-size:11px;font-weight:600}
nav .on{background:var(--g);color:#fff}
body[data-tab="map"] .v-chat,body[data-tab="map"] .v-top,body[data-tab="chat"] .v-map,body[data-tab="chat"] .v-top,body[data-tab="top"] .v-map,body[data-tab="top"] .v-chat{display:none!important}
.v-chat{display:flex;flex-direction:column;padding:0 14px 6px}
#mem{display:flex;gap:8px;overflow-x:auto;padding:6px 0;font-size:13px;white-space:nowrap}
#mem .m{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 3px;border-radius:16px;background:var(--card);border:1px solid var(--ln)}
#msgs{flex:1;overflow:auto}.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-end}.msg.me{flex-direction:row-reverse}
.bub{background:var(--card);border:1px solid var(--ln);border-radius:18px 18px 18px 4px;padding:7px 12px;max-width:78%;word-break:break-word}
.bub small{display:block;color:var(--mut);font-size:11px}.msg.me .bub{background:var(--g);color:#fff;border:0;border-radius:18px 18px 4px 18px}.msg.me .bub small{color:#fff9}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
input[type=text],input[type=date],input[type=time]{font:inherit;width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--fg)}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:16px;padding:9px 14px}a.btn{display:inline-block;text-decoration:none;margin:6px 6px 0 0}
.pri{background:var(--g);color:#fff;border:0;border-radius:16px;padding:14px;width:100%;font-weight:700;margin-top:12px}
#top{padding:4px 14px 10px;overflow:auto}.tc{border-radius:20px;padding:14px;margin:10px 0;cursor:pointer}
.bar{height:8px;border-radius:6px;background:var(--ln);margin-top:8px}.bar i{display:block;height:100%;border-radius:6px;background:var(--g)}.rk{font-size:28px;float:right}
.mut{color:var(--mut);font-size:13px}
#bd{position:fixed;inset:0;background:#0007;display:none;z-index:900}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:901;max-height:88%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));display:none;box-shadow:0 -10px 40px #0005}
#sh.full{top:0;max-height:100%;border-radius:0}h2{margin:0 0 4px;font-size:24px}
.slot{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;margin:10px 0}.slot.best{border-color:var(--ok);box-shadow:0 0 0 2px #22a55b44}
.vb{flex:1;border:1px solid var(--ln);background:var(--bg);border-radius:14px;padding:9px 0;font-size:14px}
.vb.on.y{background:var(--ok);color:#fff}.vb.on.m{background:var(--mb);color:#fff}.vb.on.n{background:var(--no);color:#fff}
.who{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;font-size:13px;color:var(--mut);align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:var(--fg)}
.em{font-size:24px;border:2px solid var(--ln);background:var(--card);border-radius:14px;padding:2px 8px}.em.on{border-color:var(--b)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:16px;font-size:14px;display:none;z-index:1000}
.cf{position:fixed;z-index:1000;pointer-events:none;font-size:20px;animation:cf .9s ease-out forwards}@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(50deg);opacity:0}}
.dk{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
</style></head><body data-tab="map">
<header><div><h1>Les piliers 🍻</h1><small id="cnt">Afterworks entre potes</small></div><span class="sp"></span><span id="me"></span></header>
<main>
<div class="v v-map"><div id="map"></div>
<div id="sr"><input type="text" id="q" class="glass" placeholder="🔎 Chercher un bar, une adresse…"><div id="res" class="glass" style="display:none"></div></div>
<div class="fabs"><button class="fab glass" id="loc">📍</button></div>
<div id="zh" class="glass">Zoome pour voir tous les bars</div><div id="list"></div></div>
<div class="v v-chat" id="chat"><div id="mem"></div><div id="msgs"></div><div class="row"><input type="text" id="mi" maxlength="300" placeholder="Écris au groupe…"><button class="btn" id="mb">🍻</button><button class="btn" id="ms">➤</button></div></div>
<div class="v v-top" id="top"></div>
</main>
<nav class="glass"><button id="t-map" class="on" onclick="tab('map')">🗺️<small>Carte</small></button><button id="t-chat" onclick="tab('chat')">💬<small>Chat</small></button><button id="t-top" onclick="tab('top')">🏆<small>Top votés</small></button></nav>
<div id="bd"></div><div id="sh"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://xwvhitiukuywkkeazlqm.supabase.co', SB_KEY='sb_publishable_o-pzdNz80MAL_W8ycvxmiA_GMKmeQFs';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS=['#ff8a3d','#e8315b','#22a55b','#2b7cff','#8e44ad','#e0a21b'],EMOS=['🍺','🍷','🍸','🥂','🍹','🥃'];
const S={uid:null,prof:{},ev:[],votes:[],msgs:[],sheet:null};
let sb;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)};
const fd=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const av=(u,c='')=>{const p=S.prof[u];return p&&p.photo?`<img class="av ${c}" src="${esc(p.photo)}" alt="">`:`<span class="av ${c}" style="background:${/^#[0-9a-f]{6}$/i.test(p&&p.color)?p.color:'#ff8a3d'}">${esc((p&&p.emo)||(p&&p.pseudo||'?')[0].toUpperCase())}</span>`};
const nm=u=>esc((S.prof[u]||{}).pseudo||'Quelqu’un');
const voters=(sl,v)=>S.votes.filter(x=>x.slot_id===sl.id&&x.value===v).map(x=>x.user_id);
const best=e=>{let b=null,n=0;e.slots.forEach(s=>{const k=voters(s,'y').length;if(k>n){n=k;b=s}});return b};
const gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function boom(el){const r=el.getBoundingClientRect();for(let i=0;i<14;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🍻','✨','🎉','🥂'][i%4];s.style.left=r.left+r.width/2+'px';s.style.top=r.top+'px';s.style.setProperty('--dx',(Math.random()*180-90)+'px');s.style.setProperty('--dy',(-Math.random()*150-30)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function open(m){S.sheet=m;$('#sh').classList.toggle('full',!!m.first);$('#bd').style.display='block';$('#sh').style.display='block';draw()}
function close(){S.sheet=null;$('#bd').style.display='none';$('#sh').style.display='none'}
$('#bd').onclick=()=>{if(!(S.sheet&&S.sheet.first))close()};
function tab(n){document.body.dataset.tab=n;['map','chat','top'].forEach(k=>$('#t-'+k).classList.toggle('on',k===n));if(n==='map')setTimeout(()=>map.invalidateSize(),50);if(n==='chat'){const c=$('#msgs');c.scrollTop=c.scrollHeight}}
/* ---- Carte ---- */
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const map=L.map('map',{zoomControl:false}).setView([48.8566,2.3522],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19,className:dark?'dk':''}).addTo(map);
const barL=L.layerGroup().addTo(map),evL=L.layerGroup().addTo(map),pplL=L.layerGroup().addTo(map),youL=L.layerGroup().addTo(map);
map.on('click',e=>newBar('',e.latlng.lat,e.latlng.lng));
let ovT,ovK='';
function bars(){clearTimeout(ovT);ovT=setTimeout(async()=>{
  if(map.getZoom()<15){barL.clearLayers();ovK='';$('#zh').style.display='block';return}
  $('#zh').style.display='none';const b=map.getBounds(),k=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(x=>x.toFixed(3)).join();if(k===ovK)return;ovK=k;
  try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(`[out:json][timeout:15];node["amenity"~"^(bar|pub)$"]["name"](${k});out 150;`)});const j=await r.json();barL.clearLayers();
    j.elements.forEach(x=>L.circleMarker([x.lat,x.lon],{radius:7,color:'#fff',weight:2,fillColor:'#ff8a3d',fillOpacity:1}).bindTooltip(esc(x.tags.name),{className:'lbl'}).on('click',ev=>{L.DomEvent.stopPropagation(ev);newBar(x.tags.name,x.lat,x.lon)}).addTo(barL))
  }catch(e){ovK='';toast('Liste des bars indisponible, réessaie.')}},500)}
map.on('moveend',bars);bars();
let qT;$('#q').oninput=()=>{clearTimeout(qT);const v=$('#q').value.trim();if(v.length<3){$('#res').style.display='none';return}
  qT=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&viewbox=2.22,48.92,2.48,48.80&q='+encodeURIComponent(v+' Paris'));const j=await r.json();
    $('#res').innerHTML=j.map((x,i)=>`<div data-i="${i}">${esc(x.display_name.split(',').slice(0,3).join(','))}</div>`).join('')||'<div>Aucun résultat</div>';$('#res').style.display='block';
    $('#res').onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;const x=j[d.dataset.i];$('#res').style.display='none';map.flyTo([+x.lat,+x.lon],17)}}catch(e){toast('Recherche indisponible.')}},600)};
$('#loc').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(async p=>{const ll=[p.coords.latitude,p.coords.longitude];youL.clearLayers();L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2b7cff',fillOpacity:1}).addTo(youL);map.flyTo(ll,16);
  const me=S.prof[S.uid];if(me&&me.share_loc)await sb.from('profiles').update({lat:ll[0],lng:ll[1]}).eq('id',S.uid)},()=>toast('Localisation refusée.')):toast('Localisation indisponible.');
function newBar(name,lat,lng){if(!S.prof[S.uid])return open({m:'profile',first:true});open({m:'new',name,lat,lng,slots:[]})}
/* ---- Rendu ---- */
function render(){
  const ids=Object.keys(S.prof);$('#cnt').textContent=ids.length?ids.length+' pilier'+(ids.length>1?'s':'')+' dans la place':'Afterworks entre potes';
  $('#me').innerHTML=S.prof[S.uid]?`<button id="mp" style="padding:0;border:0;background:none">${av(S.uid)}</button>`:'';const mp=$('#mp');if(mp)mp.onclick=()=>open({m:'profile'});
  evL.clearLayers();S.ev.forEach(e=>{const b=best(e),n=b?voters(b,'y').length:0;L.marker([e.lat,e.lng],{icon:L.divIcon({className:'',html:`<div class="pinx"><span>${n||'🍻'}</span></div>`,iconSize:[36,36],iconAnchor:[18,36]})}).bindTooltip(esc(e.name),{permanent:true,direction:'top',offset:[0,-34],className:'lbl'}).on('click',ev=>{L.DomEvent.stopPropagation(ev);open({m:'event',id:e.id})}).addTo(evL)});
  pplL.clearLayers();ids.forEach(u=>{const p=S.prof[u];if(u!==S.uid&&p.share_loc&&p.lat!=null)L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:av(u,'s'),iconSize:[24,24]})}).bindTooltip(esc(p.pseudo),{className:'lbl'}).addTo(pplL)});
  $('#list').innerHTML=S.ev.map(e=>{const b=best(e);return `<button class="chip glass" data-e="${e.id}"><b>${esc(e.name)}</b><small>${b?'⭐ '+fd(b.day)+' · '+esc(b.time):e.slots.length+' créneau(x)'}</small></button>`}).join('');
  document.querySelectorAll('#list [data-e]').forEach(b=>b.onclick=()=>{const e=S.ev.find(x=>x.id===b.dataset.e);map.flyTo([e.lat,e.lng],16);open({m:'event',id:e.id})});
  $('#mem').innerHTML=ids.map(u=>`<span class="m">${av(u,'s')}${nm(u)}</span>`).join('');
  const c=$('#msgs'),low=c.scrollHeight-c.scrollTop-c.clientHeight<60;
  c.innerHTML=S.msgs.map(m=>`<div class="msg ${m.user_id===S.uid?'me':''}">${av(m.user_id,'s')}<div class="bub"><small>${nm(m.user_id)}</small>${esc(m.body)}</div></div>`).join('')||'<p class="mut" style="text-align:center;margin-top:40px">Aucun message. Lance la discussion 🍻</p>';if(low)c.scrollTop=c.scrollHeight;
  const r=S.ev.map(e=>({e,y:e.slots.reduce((a,s)=>a+voters(s,'y').length,0),b:best(e)})).sort((a,b)=>b.y-a.y),mx=Math.max(1,...r.map(x=>x.y));
  $('#top').innerHTML=`<h2 style="margin:6px 0">Le classement 🏆</h2>`+(r.length?r.map((x,i)=>`<div class="tc glass" data-e="${x.e.id}"><span class="rk">${['🥇','🥈','🥉'][i]||'#'+(i+1)}</span><b style="font-size:18px">${esc(x.e.name)}</b><div class="mut">${x.y} ✅ au total${x.b?' · ⭐ '+fd(x.b.day)+' à '+esc(x.b.time):''}</div><div class="bar"><i style="width:${x.y/mx*100}%"></i></div></div>`).join(''):'<p class="mut">Aucun bar pour l’instant : touche un bar sur la carte !</p>');
  if(S.sheet&&S.sheet.m==='event')draw();
}
$('#top').onclick=e=>{const d=e.target.closest('[data-e]');if(d){const x=S.ev.find(v=>v.id===d.dataset.e);tab('map');map.setView([x.lat,x.lng],16);open({m:'event',id:x.id})}};
async function send(t){t=(t||'').trim();if(!t)return;if(!S.prof[S.uid])return open({m:'profile',first:true});const {error}=await sb.from('messages').insert({body:t});if(error)toast('Message non envoyé.')}
$('#ms').onclick=()=>{send($('#mi').value);$('#mi').value=''};$('#mb').onclick=()=>send('🍻');$('#mi').onkeydown=e=>{if(e.key==='Enter'){send($('#mi').value);$('#mi').value=''}};
function draw(){
  const s=S.sheet,h=$('#sh');if(!s)return;
  if(s.m==='profile'){
    const p=S.prof[S.uid]||{};let photo=p.photo||'',color=p.color||COLORS[0],emo=p.emo||EMOS[0];
    h.innerHTML=`${s.first?'<div style="text-align:center;font-size:56px;margin-top:20px">🍻</div>':''}<h2 ${s.first?'style="text-align:center"':''}>${s.first?'Bienvenue aux piliers':'Ton profil'}</h2><p class="mut" ${s.first?'style="text-align:center"':''}>Pseudo, photo, couleur et emoji : c’est tout.</p><div style="text-align:center;margin:14px 0"><span id="pv"></span></div><div class="row"><input type="file" accept="image/*" id="pf"></div><input type="text" id="pn" maxlength="20" placeholder="Ton pseudo" value="${esc(p.pseudo||'')}"><p class="mut">Ta couleur</p><div class="row" id="pc"></div><p class="mut">Ton emoji</p><div class="row" id="pe" style="flex-wrap:wrap"></div><label class="row mut"><input type="checkbox" id="pl" ${p.share_loc?'checked':''}> Partager ma position avec le groupe (optionnel)</label><button class="pri" id="ps">${s.first?'Rejoindre le groupe 🚀':'Enregistrer'}</button>`;
    const R=()=>{$('#pv').innerHTML=photo?`<img class="av xl" src="${photo}">`:`<span class="av xl" style="background:${color}">${emo}</span>`;$('#pc').innerHTML=COLORS.map(c=>`<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('');$('#pe').innerHTML=EMOS.map(x=>`<button class="em ${x===emo?'on':''}" data-x="${x}">${x}</button>`).join('')};R();
    $('#pc').onclick=e=>{if(e.target.dataset.c){color=e.target.dataset.c;R()}};$('#pe').onclick=e=>{if(e.target.dataset.x){emo=e.target.dataset.x;R()}};
    $('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=80;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,80,80);photo=c.toDataURL('image/jpeg',.7);R()};i.src=r.result};r.readAsDataURL(f)};
    $('#ps').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return toast('Choisis un pseudo.');const sl=$('#pl').checked,row={id:S.uid,pseudo:n,photo,color,emo,share_loc:sl};if(!sl){row.lat=null;row.lng=null}const {error}=await sb.from('profiles').upsert(row);if(error)return toast('Enregistrement impossible.');close();load()};
  }else if(s.m==='new'){
    h.innerHTML=`<h2>Proposer un bar</h2><input type="text" id="bn" maxlength="60" placeholder="Nom du bar" value="${esc(s.name||'')}"><p class="mut">Dates et créneaux proposés :</p><div id="sl"></div><div class="row"><input type="date" id="sd"><input type="time" id="st" value="19:00"><button class="btn" id="sa">＋</button></div><button class="pri" id="sp">Publier 🚀</button>`;
    const L2=()=>$('#sl').innerHTML=s.slots.map((x,i)=>`<div class="row">📅 ${fd(x.day)} · ${esc(x.time)} <button class="btn" data-i="${i}">✕</button></div>`).join('');
    $('#sl').onclick=e=>{const i=e.target.dataset.i;if(i!=null){s.slots.splice(i,1);L2()}};
    $('#sa').onclick=()=>{const d=$('#sd').value,t=$('#st').value;if(!d||!t)return toast('Choisis une date et une heure.');s.slots.push({day:d,time:t});L2()};
    $('#sp').onclick=async()=>{const n=$('#bn').value.trim();if(!n||!s.slots.length)return toast('Il faut un nom et au moins un créneau.');const {data,error}=await sb.from('events').insert({name:n,lat:s.lat,lng:s.lng}).select().single();if(error)return toast('Publication impossible.');await sb.from('slots').insert(s.slots.map(x=>({...x,event_id:data.id})));close();load()};
  }else{
    const e=S.ev.find(x=>x.id===s.id);if(!e){close();return}
    const b=best(e),tot=Math.max(1,Object.keys(S.prof).length);
    h.innerHTML=`<h2>${esc(e.name)}</h2><div class="mut">proposé par ${nm(e.created_by)}</div><a class="btn" target="_blank" rel="noopener" href="${gm(e.name+' Paris')}">🗺️ Ouvrir dans Google Maps</a>`+e.slots.map(x=>{const y=voters(x,'y'),m=voters(x,'m'),mine=(S.votes.find(v=>v.slot_id===x.id&&v.user_id===S.uid)||{}).value;return `<div class="slot ${b&&x.id===b.id?'best':''}"><b>${fd(x.day)} · ${esc(x.time)}</b>${b&&x.id===b.id?' ⭐':''}<span class="mut" style="float:right">${y.length}/${tot} dispos</span><div class="row">${[['y','✅ Dispo'],['m','🤷 Peut-être'],['n','❌ Non']].map(([k,l])=>`<button class="vb ${k} ${mine===k?'on':''}" data-s="${x.id}" data-v="${k}">${l}</button>`).join('')}</div><div class="who">${y.map(u=>av(u,'s')).join('')} ${y.length?y.map(nm).join(', '):'Personne pour l’instant'}${m.length?` · peut-être : ${m.map(nm).join(', ')}`:''}</div></div>`}).join('')+(e.created_by===S.uid?'<button class="btn" id="del" style="margin-top:8px">Supprimer ce bar</button>':'');
    h.querySelectorAll('.vb').forEach(k=>k.onclick=async()=>{if(!S.prof[S.uid])return open({m:'profile',first:true});const sid=k.dataset.s,v=k.dataset.v,cur=(S.votes.find(x=>x.slot_id===sid&&x.user_id===S.uid)||{}).value;let er;if(cur===v)({error:er}=await sb.from('votes').delete().eq('slot_id',sid).eq('user_id',S.uid));else{if(v==='y')boom(k);({error:er}=await sb.from('votes').upsert({slot_id:sid,user_id:S.uid,value:v}))}if(er)toast('Vote refusé.');load()});
    const d=$('#del');if(d)d.onclick=async()=>{await sb.from('events').delete().eq('id',e.id);close();load()};
  }
}
/* ---- Données ---- */
let lT;const later=()=>{clearTimeout(lT);lT=setTimeout(load,250)};
async function load(){
  const [p,e,s,v,m]=await Promise.all([sb.from('profiles').select('*'),sb.from('events').select('*').order('created_at'),sb.from('slots').select('*').order('day').order('time'),sb.from('votes').select('*'),sb.from('messages').select('*').order('created_at',{ascending:false}).limit(100)]);
  if(p.error||e.error)return toast('Connexion aux données impossible.');
  S.prof={};p.data.forEach(x=>S.prof[x.id]=x);S.votes=v.data||[];S.msgs=(m.data||[]).reverse();
  S.ev=e.data.map(x=>({...x,slots:(s.data||[]).filter(y=>y.event_id===x.id)}));
  render();if(!S.asked&&!S.prof[S.uid]){S.asked=true;open({m:'profile',first:true})}
}
(async()=>{
  if(SB_URL.startsWith('COLLE')){document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px">Configure SB_URL et SB_KEY dans index.html (voir README).</p>');return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();if(r.error)return toast('Activer les connexions anonymes dans Supabase.');session=r.data.session}
  S.uid=session.user.id;await load();
  sb.channel('piliers').on('postgres_changes',{event:'*',schema:'public'},later).subscribe();
})();
</script></body></html>
