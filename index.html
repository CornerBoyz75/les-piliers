<script>

  if(map.getZoom()<15){ovK='';$('#zh').style.display='block';drawBars();return}

$('#ms').onclick=()=>{send($('#mi').value);$('#mi').value=''};$('#mi').onkeydown=e=>{if(e.key==='Enter'){send($('#mi').value);$('#mi').value=''}};
function draw(){
  const s=S.sheet,h=$('#sh');if(!s)return;
  if(s.m==='profile'){
    const p=S.prof[S.uid]||{};let photo=p.photo||'',color=p.color||COLORS[0],emo=p.emo||EMOS[0];
    h.innerHTML=`${s.first?'<div style="height:30px"></div>':''}<h2>${s.first?'Bienvenue 👋':'Ton profil'}</h2><p class="mut">Pseudo, photo, couleur et emoji : c’est tout.</p><div style="text-align:center;margin:16px 0"><span id="pv"></span></div><div class="grp"><div class="r"><input type="file" accept="image/*" id="pf"></div><div class="r"><input type="text" id="pn" maxlength="20" placeholder="Ton pseudo" value="${esc(p.pseudo||'')}"></div></div><p class="mut">Couleur</p><div class="row" id="pc"></div><p class="mut">Emoji</p><div class="row" id="pe" style="flex-wrap:wrap"></div><label class="row mut"><input type="checkbox" id="pl" ${p.share_loc?'checked':''}> Partager ma position avec le groupe (optionnel)</label><button class="pri" id="ps">${s.first?'Continuer':'Enregistrer'}</button>`;
    const R=()=>{$('#pv').innerHTML=photo?`<img class="av xl" src="${photo}">`:`<span class="av xl" style="background:${color}">${emo}</span>`;$('#pc').innerHTML=COLORS.map(c=>`<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('');$('#pe').innerHTML=EMOS.map(x=>`<button class="em ${x===emo?'on':''}" data-x="${x}">${x}</button>`).join('')};R();
    $('#pc').onclick=e=>{if(e.target.dataset.c){color=e.target.dataset.c;R()}};$('#pe').onclick=e=>{if(e.target.dataset.x){emo=e.target.dataset.x;R()}};
    $('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=80;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,80,80);photo=c.toDataURL('image/jpeg',.7);R()};i.src=r.result};r.readAsDataURL(f)};
    $('#ps').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return toast('Choisis un pseudo.');const sl=$('#pl').checked,row={id:S.uid,pseudo:n,photo,color,emo,share_loc:sl};if(!sl){row.lat=null;row.lng=null}const {error}=await sb.from('profiles').upsert(row);if(error)return toast('Enregistrement impossible.');close();load()};
  }else if(s.m==='bar'){
    const t=s.t||{},ad=[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),web=/^https?:\/\//.test(t.website||'')?t.website:'';
    h.innerHTML=`<h2>${esc(s.name)}</h2><div class="mut">🍸 ${t.amenity==='pub'?'Pub':'Bar'}${ad?' · '+esc(ad):''}</div>${t.opening_hours?`<div class="grp"><div class="r"><span>Horaires</span><span class="mut" style="text-align:right">${esc(t.opening_hours)}</span></div></div>`:''}<button class="pri" id="bp">Proposer pour un afterwork</button><a class="btn" target="_blank" rel="noopener" href="${gm(s.name+' Paris')}">Itinéraire et avis (Google Maps)</a>${web?`<a class="btn" target="_blank" rel="noopener" href="${esc(web)}">Site web</a>`:''}`;
    $('#bp').onclick=()=>{close();newBar(s.name,s.lat,s.lon)};
  }else if(s.m==='new'){
    h.innerHTML=`<h2>Proposer un bar</h2><div class="grp"><div class="r"><input type="text" id="bn" maxlength="60" placeholder="Nom du bar" value="${esc(s.name||'')}"></div></div><p class="mut">Dates et créneaux proposés</p><div id="sl"></div><div class="row"><input type="date" id="sd"><input type="time" id="st" value="19:00"><button class="btn" id="sa">＋</button></div><button class="pri" id="sp">Publier</button>`;
    const L2=()=>$('#sl').innerHTML=s.slots.map((x,i)=>`<div class="row">📅 ${fd(x.day)} · ${esc(x.time)} <button class="btn" data-i="${i}" style="margin-left:auto">✕</button></div>`).join('');
    $('#sl').onclick=e=>{const i=e.target.dataset.i;if(i!=null){s.slots.splice(i,1);L2()}};
    $('#sa').onclick=()=>{const d=$('#sd').value,t=$('#st').value;if(!d||!t)return toast('Choisis une date et une heure.');s.slots.push({day:d,time:t});L2()};
    $('#sp').onclick=async()=>{const n=$('#bn').value.trim();if(!n||!s.slots.length)return toast('Il faut un nom et au moins un créneau.');const {data,error}=await sb.from('events').insert({name:n,lat:s.lat,lng:s.lng}).select().single();if(error)return toast('Publication impossible.');await sb.from('slots').insert(s.slots.map(x=>({...x,event_id:data.id})));close();load()};
  }else{
    const e=S.ev.find(x=>x.id===s.id);if(!e){close();return}
    const b=best(e),tot=Math.max(1,Object.keys(S.prof).length);
    h.innerHTML=`<h2>${esc(e.name)}</h2><div class="mut">proposé par ${nm(e.created_by)}</div><a class="btn" target="_blank" rel="noopener" href="${gm(e.name+' Paris')}">Itinéraire (Google Maps)</a>`+e.slots.map(x=>{const y=voters(x,'y'),m=voters(x,'m'),mine=(S.votes.find(v=>v.slot_id===x.id&&v.user_id===S.uid)||{}).value;return `<div class="slot ${b&&x.id===b.id?'best':''}"><b>${fd(x.day)} · ${esc(x.time)}</b>${b&&x.id===b.id?' ⭐':''}<span class="mut" style="float:right">${y.length}/${tot} dispos</span><div class="seg">${[['y','Dispo'],['m','Peut-être'],['n','Non']].map(([k,l])=>`<button class="vb ${k} ${mine===k?'on':''}" data-s="${x.id}" data-v="${k}">${l}</button>`).join('')}</div><div class="who">${y.map(u=>av(u,'s')).join('')} ${y.length?y.map(nm).join(', '):'Personne pour l’instant'}${m.length?` · peut-être : ${m.map(nm).join(', ')}`:''}</div></div>`}).join('')+(e.created_by===S.uid?'<button class="btn" id="del" style="margin-top:8px;color:var(--no)">Supprimer ce bar</button>':'');
    h.querySelectorAll('.vb').forEach(k=>k.onclick=async()=>{if(!S.prof[S.uid])return open({m:'profile',first:true});const sid=k.dataset.s,v=k.dataset.v,cur=(S.votes.find(x=>x.slot_id===sid&&x.user_id===S.uid)||{}).value;let er;if(cur===v)({error:er}=await sb.from('votes').delete().eq('slot_id',sid).eq('user_id',S.uid));else{if(v==='y')boom(k);({error:er}=await sb.from('votes').upsert({slot_id:sid,user_id:S.uid,value:v}))}if(er)toast('Vote refusé.');load()});
    const d=$('#del');if(d)d.onclick=async()=>{await sb.from('events').delete().eq('id',e.id);close();load()};
  }
}
/* ---- Données ---- */
let lT;const later=()=>{clearTimeout(lT);lT=setTimeout(load,250)};
async function load(){
  const [p,e,s,v,m]=await Promise.all([sb.from('profiles').select('*'),sb.from('events').select('*').order('created_at'),sb.from('slots').select('*').order('day').order('time'),sb.from('votes').select('*'),sb.from('messages').select('*').order('created_at',{ascending:false}).limit(100)]);
  if(p.error||e.error)return toast('Connexion aux données impossible.');
  S.prof={};p.data.forEach(x=>S.prof[x.id]=x);S.votes=v.data||[];S.msgs=(m.data||[]).reverse();
  S.ev=e.data.map(x=>({...x,slots:(s.data||[]).filter(y=>y.event_id===x.id)}));
  render();if(!S.asked&&!S.prof[S.uid]){S.asked=true;open({m:'profile',first:true})}
}
(async()=>{
  sb=supabase.createClient(SB_URL,SB_KEY);
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();if(r.error)return toast('Activer les connexions anonymes dans Supabase.');session=r.data.session}
  S.uid=session.user.id;await load();
  sb.channel('piliers').on('postgres_changes',{event:'*',schema:'public'},later).subscribe();
})();
</script></body></html>
